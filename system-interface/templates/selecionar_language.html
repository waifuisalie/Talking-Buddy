{% extends "base.html" %}

{% block title %}Selecionar Idioma da IA{% endblock %}

{% block content %}
<div class="box">
    <div class="box-header">IDIOMA DA IA</div>
    <div class="box-content">
        <div class="btn-grid-2col">
            <button class="btn btn-selection" onclick="selectOption('pt-BR')">PORTUGUES (pt-BR)</button>
            <button class="btn btn-selection" onclick="selectOption('en-US')">INGLES (en-US)</button>
            <button class="btn btn-selection" onclick="selectOption('es-ES')">ESPANHOL (es-ES)</button>
        </div>
        <div class="btn-stack btn-stack-top-spaced">
            <button class="btn btn-secondary" onclick="goBackToForm()">CANCELAR</button>
        </div>
    </div>
</div>

<script>
function selectOption(value) {
    sessionStorage.setItem('language', value);
    
    // Verifica se está editando
    const editingMode = sessionStorage.getItem('editing_mode');
    const userId = sessionStorage.getItem('editing_user_id');
    
    if (editingMode === 'true' && userId) {
        window.location.href = `/usuarios/editar/${userId}`;
    } else {
        window.location.href = "{{ url_for('novo_usuario') }}";
    }
}

function goBackToForm() {
    const editingMode = sessionStorage.getItem('editing_mode');
    const userId = sessionStorage.getItem('editing_user_id');
    
    if (editingMode === 'true' && userId) {
        window.location.href = `/usuarios/editar/${userId}`;
    } else {
        window.location.href = "{{ url_for('novo_usuario') }}";
    }
}
</script>
{% endblock %}
