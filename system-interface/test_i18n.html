<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste i18n - TalkingBuddy</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #0f0; text-align: center; }
        .test-section {
            border: 2px solid #0f0;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        button {
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        button:hover {
            background: #0f0;
            color: #000;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #111;
            border-left: 3px solid #0f0;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
    </style>
</head>
<body>
    <h1>🌐 Sistema de Internacionalização (i18n)</h1>
    <p style="text-align: center;">Teste de traduções para pt-BR, en-US, es-ES</p>

    <div class="test-section">
        <h2>1. Testar Idiomas</h2>
        <button onclick="testLanguage('pt-BR')">🇧🇷 Português</button>
        <button onclick="testLanguage('en-US')">🇺🇸 Inglês</button>
        <button onclick="testLanguage('es-ES')">🇪🇸 Espanhol</button>
        <div id="lang-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>2. Testar Traduções</h2>
        <button onclick="testAllTranslations()">Testar Todas</button>
        <div id="translations-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>3. Elementos da Interface</h2>
        <div style="margin: 20px 0;">
            <button data-i18n-text="buttons.send">ENVIAR</button>
            <input type="text" data-i18n-placeholder="placeholders.type_message" placeholder="Digite sua mensagem..." style="width: 300px; padding: 10px; background: #000; color: #0f0; border: 2px solid #0f0;">
            <button data-i18n-title="buttons.mic" title="Gravar mensagem de voz">🎤</button>
        </div>
        <button onclick="updateElements()">Atualizar Elementos</button>
        <div id="elements-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>4. Interpolação</h2>
        <input type="text" id="userName" placeholder="Digite um nome" value="João" style="padding: 10px; background: #000; color: #0f0; border: 2px solid #0f0; width: 200px;">
        <button onclick="testInterpolation()">Testar</button>
        <div id="interpolation-result" class="result"></div>
    </div>

    <script src="../static/js/i18n.js"></script>
    <script>
        function testLanguage(lang) {
            const result = document.getElementById('lang-result');
            i18n.setLanguage(lang);
            
            const tests = [
                { key: 'buttons.send', desc: 'Botão Enviar' },
                { key: 'placeholders.type_message', desc: 'Placeholder Input' },
                { key: 'messages.welcome_no_name', desc: 'Mensagem Boas-vindas' }
            ];
            
            let html = `<strong class="success">✅ Idioma: ${lang}</strong><br><br>`;
            tests.forEach(test => {
                const translation = i18n.t(test.key);
                html += `<strong>${test.desc}:</strong> ${translation}<br>`;
            });
            
            result.innerHTML = html;
            updateElements();
        }

        function testAllTranslations() {
            const result = document.getElementById('translations-result');
            const keys = [
                'buttons.admin',
                'buttons.logout',
                'buttons.close_chat',
                'buttons.mic',
                'buttons.send',
                'placeholders.type_message',
                'placeholders.wait_response',
                'placeholders.recording',
                'placeholders.not_understood',
                'placeholders.recording_error',
                'messages.welcome_no_name'
            ];
            
            const languages = ['pt-BR', 'en-US', 'es-ES'];
            let html = '<table style="width: 100%; border-collapse: collapse;">';
            html += '<tr><th style="border: 1px solid #0f0; padding: 5px;">Chave</th>';
            languages.forEach(lang => {
                html += `<th style="border: 1px solid #0f0; padding: 5px;">${lang}</th>`;
            });
            html += '</tr>';
            
            keys.forEach(key => {
                html += `<tr><td style="border: 1px solid #0f0; padding: 5px;">${key}</td>`;
                languages.forEach(lang => {
                    const translation = i18n.t(key, {}, lang);
                    html += `<td style="border: 1px solid #0f0; padding: 5px;">${translation}</td>`;
                });
                html += '</tr>';
            });
            html += '</table>';
            
            result.innerHTML = html;
        }

        function updateElements() {
            const result = document.getElementById('elements-result');
            let updated = 0;
            
            // Atualizar data-i18n-text
            document.querySelectorAll('[data-i18n-text]').forEach(el => {
                const key = el.getAttribute('data-i18n-text');
                el.textContent = i18n.t(key);
                updated++;
            });
            
            // Atualizar data-i18n-placeholder
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = i18n.t(key);
                updated++;
            });
            
            // Atualizar data-i18n-title
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                el.title = i18n.t(key);
                updated++;
            });
            
            result.innerHTML = `<span class="success">✅ ${updated} elementos atualizados (idioma: ${i18n.getCurrentLanguage()})</span>`;
        }

        function testInterpolation() {
            const result = document.getElementById('interpolation-result');
            const name = document.getElementById('userName').value;
            
            const languages = ['pt-BR', 'en-US', 'es-ES'];
            let html = '';
            
            languages.forEach(lang => {
                const message = i18n.t('messages.welcome_with_name', { name: name }, lang);
                html += `<strong>${lang}:</strong><br><pre style="margin: 5px 0 15px 0;">${message}</pre>`;
            });
            
            result.innerHTML = html;
        }

        // Testes automáticos ao carregar
        window.addEventListener('load', () => {
            console.log('🧪 [Test] Iniciando testes automáticos...');
            
            // Teste 1: Verificar se i18n está disponível
            if (typeof i18n === 'undefined') {
                alert('❌ ERRO: i18n não carregado!');
                return;
            }
            console.log('✅ [Test] i18n disponível');
            
            // Teste 2: Verificar idiomas suportados
            const supported = i18n.getSupportedLanguages();
            console.log('✅ [Test] Idiomas suportados:', supported);
            
            // Teste 3: Testar cada idioma
            ['pt-BR', 'en-US', 'es-ES'].forEach(lang => {
                i18n.setLanguage(lang);
                const test = i18n.t('buttons.send');
                console.log(`✅ [Test] ${lang}: "${test}"`);
            });
            
            console.log('✅ [Test] Todos os testes passaram!');
            
            // Definir idioma padrão e atualizar interface
            i18n.setLanguage('pt-BR');
            updateElements();
        });
    </script>
</body>
</html>
